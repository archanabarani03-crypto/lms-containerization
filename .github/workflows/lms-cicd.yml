
name: LMS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force deployment failure to test automatic rollback"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lms-production-deployment
  cancel-in-progress: false

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install and Test Backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-frontend:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-backend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SIMULATE_FAILURE
          script: |
            set -uo pipefail

            cd /home/ubuntu/lms-deployment

            test -f docker-compose.prod.yml
            test -f .env

            NEW_TAG="${{ github.sha }}"
            PREVIOUS_TAG=""

            if [ -f .last_successful_image_tag ]; then
              PREVIOUS_TAG=$(cat .last_successful_image_tag)
            fi

            echo "New image: $NEW_TAG"
            echo "Previous successful image: $PREVIOUS_TAG"

            wait_for_health() {
              for i in $(seq 1 30); do
                BACKEND_STATUS=$(docker inspect \
                  --format='{{.State.Health.Status}}' \
                  lms-backend 2>/dev/null || echo missing)

                FRONTEND_STATUS=$(docker inspect \
                  --format='{{.State.Health.Status}}' \
                  lms-frontend 2>/dev/null || echo missing)

                if [ "$BACKEND_STATUS" = "healthy" ] && \
                   [ "$FRONTEND_STATUS" = "healthy" ] && \
                   curl --fail --silent \
                   http://localhost/api/health >/dev/null; then
                  return 0
                fi

                echo "Waiting for application health: backend=$BACKEND_STATUS frontend=$FRONTEND_STATUS"
                sleep 5
              done

              return 1
            }

            DEPLOY_OK=false

            if IMAGE_TAG="$NEW_TAG" docker compose \
              --env-file .env -f docker-compose.prod.yml pull &&
               IMAGE_TAG="$NEW_TAG" docker compose \
              --env-file .env -f docker-compose.prod.yml up -d --remove-orphans; then

              if wait_for_health; then
                DEPLOY_OK=true
              fi
            fi

            if [ "${SIMULATE_FAILURE:-false}" = "true" ]; then
              echo "TEST MODE: Simulating deployment failure."
              DEPLOY_OK=false
            fi

            if [ "$DEPLOY_OK" = true ]; then
              echo "$NEW_TAG" > .last_successful_image_tag
              echo "Deployment successful: $NEW_TAG"
              exit 0
            fi

            echo "Deployment failed. Starting rollback."

            if [ -z "$PREVIOUS_TAG" ]; then
              echo "ERROR: No previous successful image tag available."
              exit 1
            fi

            if IMAGE_TAG="$PREVIOUS_TAG" docker compose \
              --env-file .env -f docker-compose.prod.yml pull &&
               IMAGE_TAG="$PREVIOUS_TAG" docker compose \
              --env-file .env -f docker-compose.prod.yml up -d; then

              if wait_for_health; then
                echo "$PREVIOUS_TAG" > .last_successful_image_tag
                echo "Rollback successful: $PREVIOUS_TAG"
                exit 1
              fi
            fi

            echo "CRITICAL: Rollback could not be verified."
            exit 1
